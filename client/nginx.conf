# Frutales web client — nginx site configuration.
# Mounted at /etc/nginx/conf.d/default.conf in the production image.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Receipt photos travel as base64 JSON payloads (bounded at ~2 MB/image).
    client_max_body_size 6m;

    # ---------------------------------------------------------------------
    # gzip compression for text assets
    # ---------------------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------------------------------------------------------------------
    # Container healthcheck endpoint (used by Docker Compose)
    # ---------------------------------------------------------------------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---------------------------------------------------------------------
    # API reverse proxy -> Express container (service name "server")
    # No trailing slash on proxy_pass: the /api prefix is preserved.
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # SPA routing: unknown paths fall back to index.html (React Router)
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html should never be cached (it references hashed assets).
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
