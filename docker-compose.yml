# Frutales — production stack (behind Nginx Proxy Manager).
#
#   docker compose up --build -d
#
# Networking: the "client" container joins the external network "npm_net"
# (shared with the Nginx Proxy Manager container) so NPM forwards traffic to
# it as http://frutales-client:80. No app port is published on the host.
# Requires a root ".env" file (copy .env.example and change the secrets).
name: frutales

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 (data persisted in the named volume "postgres_data")
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # Named volume: database data survives container recreations/redeploys.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes compose interpolation so the shell expands the vars.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # ---------------------------------------------------------------------------
  # One-shot init container: applies pending Prisma migrations, then exits.
  # The "build" target image contains the Prisma CLI and prisma/ folder.
  # "server" waits for this to finish (service_completed_successfully).
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./server
      target: build
    command: ["npm", "run", "prisma:deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Express API (internal only — reached through the nginx proxy)
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ./server
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"

  # ---------------------------------------------------------------------------
  # React SPA + reverse proxy.
  # No host port mappings: Nginx Proxy Manager reaches this container inside
  # the npm_net network. The unique alias avoids DNS collisions with other
  # stacks that also run a service called "client".
  # ---------------------------------------------------------------------------
  client:
    build:
      context: ./client
      args:
        # Baked into the bundle: the SPA calls the same-origin nginx proxy.
        VITE_API_URL: /api
    restart: unless-stopped
    networks:
      # Keeps talking to "server" on the project's internal network...
      default: {}
      # ...and is reachable by Nginx Proxy Manager on npm_net.
      npm_net:
        aliases:
          - frutales-client
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  # Created/owned by Nginx Proxy Manager; must already exist on the host.
  npm_net:
    external: true
